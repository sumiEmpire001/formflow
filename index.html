<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FormFlow</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="wrap"><p class="eyebrow">FormFlow</p><h1>Forms made simple.</h1><p>Schema-driven form builder demonstration.</p></div></header><main class="wrap"><section class="panel"><h2 id="title">Loading form…</h2><p id="description"></p><form id="dynamic-form" novalidate></form><p id="status" role="status" aria-live="polite"></p></section><section class="panel"><h2>Latest submission preview</h2><pre id="preview">No submission yet.</pre></section><p class="note">No information is sent to a server. This demo only shows a local preview of form submissions.</p></main><script type="module" src="app.js"></script></body></html>
